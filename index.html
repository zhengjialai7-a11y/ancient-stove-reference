<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>古代灶台美术参考图库</title>
<style>
:root{--bg:#f4f1ea;--panel:#fffdf8;--ink:#24231f;--muted:#777268;--line:#ded8cc;--accent:#6f4c2f;--chip:#ece4d7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(244,241,234,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.wrap{max-width:1500px;margin:auto;padding:18px 24px}.top{display:flex;gap:18px;align-items:end;justify-content:space-between;flex-wrap:wrap}
h1{font-size:26px;margin:0 0 4px}.sub{font-size:13px;color:var(--muted)}.controls{display:flex;gap:8px;flex-wrap:wrap}
.controls input,.controls select{height:38px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:0 11px;color:var(--ink)}
.stats{font-size:13px;color:var(--muted);margin-top:12px}main{max-width:1500px;margin:auto;padding:22px 24px 60px}
.notice{background:#fff8e8;border:1px solid #ead7a8;padding:10px 12px;border-radius:10px;font-size:12px;line-height:1.6;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:.18s;box-shadow:0 2px 10px rgba(0,0,0,.025)}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08)}.thumb{height:210px;overflow:hidden;background:#ddd;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:.2s}.badge{position:absolute;top:10px;left:10px;background:rgba(30,27,22,.78);color:#fff;padding:4px 8px;border-radius:999px;font-size:12px}
.meta{padding:13px}.meta h3{font-size:15px;line-height:1.4;margin:0 0 8px}.line{font-size:12px;color:var(--muted);line-height:1.55}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{font-size:11px;background:var(--chip);padding:4px 7px;border-radius:999px}
.empty{text-align:center;padding:80px;color:var(--muted)}.modal{position:fixed;inset:0;background:rgba(20,18,15,.78);z-index:100;display:none;align-items:center;justify-content:center;padding:24px}
.modal.show{display:flex}.modalbox{width:min(1180px,96vw);height:min(760px,92vh);background:var(--panel);border-radius:16px;overflow:hidden;display:grid;grid-template-columns:1.65fr 1fr}
.viewer{background:#201f1c;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.detail{padding:24px;overflow:auto}.detail h2{font-size:22px;margin:0 0 12px}.detail dl{margin:0}.detail dt{color:var(--muted);font-size:12px;margin-top:14px}.detail dd{margin:4px 0 0;font-size:14px;line-height:1.6}
a.btn{display:inline-block;margin-top:18px;padding:10px 14px;background:var(--accent);color:white;text-decoration:none;border-radius:10px}.close{position:absolute;right:15px;top:12px;border:0;background:#fff;border-radius:50%;width:36px;height:36px;font-size:22px;cursor:pointer;z-index:2}
@media(max-width:800px){.modalbox{grid-template-columns:1fr;height:94vh}.viewer{min-height:52vh}.detail{max-height:42vh}.thumb{height:180px}}
</style></head>
<body>
<header><div class="wrap"><div class="top">
<div><h1>古代灶台美术参考图库</h1><div class="sub">古代 / 汉代 / 宋代 · 灶台、庖厨、茶炉、人物动作参考</div></div>
<div class="controls"><input id="q" placeholder="搜索：灶门 / 风炉 / 南宋…"/><select id="era"><option value="">全部年代</option></select><select id="type"><option value="">全部类型</option></select><select id="inst"><option value="">全部来源</option></select></div>
</div><div class="stats" id="stats"></div></div></header>
<main><div class="notice">说明：图库中的“局部参考”是从同一件原作/文物照片中按不同绘制重点进行的浏览裁切；点击卡片可查看原图，并可从“查看来源页”核对作品信息。图片版权与使用条件以来源机构页面为准。</div><div class="grid" id="grid"></div></main>
<div class="modal" id="modal"><div class="modalbox">
<div class="viewer"><button class="close" id="close">×</button><img id="mimg"/></div>
<div class="detail"><h2 id="mtitle"></h2><dl>
<dt>年代</dt><dd id="mera"></dd><dt>类型</dt><dd id="mtype"></dd><dt>馆藏 / 来源机构</dt><dd id="minst"></dd><dt>本条绘制重点</dt><dd id="mfocus"></dd><dt>参考说明</dt><dd id="mnote"></dd>
</dl><a class="btn" id="mlink" target="_blank" rel="noopener">查看来源页 ↗</a></div>
</div></div>
<script src="data.js"></script>
<script>
const data=window.REFERENCE_DATA,$=s=>document.querySelector(s),grid=$("#grid"),q=$("#q"),era=$("#era"),type=$("#type"),inst=$("#inst");
function options(sel,key){[...new Set(data.map(x=>x[key]))].sort().forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;sel.appendChild(o)})}
options(era,"era");options(type,"type");options(inst,"institution");
function render(){const term=q.value.trim().toLowerCase(),ev=era.value,tv=type.value,iv=inst.value;
const rows=data.filter(x=>(!ev||x.era===ev)&&(!tv||x.type===tv)&&(!iv||x.institution===iv)&&(!term||JSON.stringify(x).toLowerCase().includes(term)));
$("#stats").textContent=`显示 ${rows.length} / ${data.length} 条参考`;grid.innerHTML=rows.length?"":'<div class="empty">没有匹配结果</div>';
rows.forEach(x=>{const c=document.createElement("article");c.className="card";
c.innerHTML=`<div class="thumb"><img loading="lazy" src="${x.image}" style="object-position:${x.position};transform:scale(${x.scale})"><span class="badge">${x.era}</span></div><div class="meta"><h3>${x.title}</h3><div class="line">${x.institution}</div><div class="line">${x.type}</div><div class="chips">${x.tags.slice(0,3).map(t=>`<span class="chip">${t}</span>`).join("")}</div></div>`;
c.onclick=()=>openModal(x);grid.appendChild(c)})}
function openModal(x){$("#mtitle").textContent=x.title;$("#mera").textContent=x.era;$("#mtype").textContent=x.type;$("#minst").textContent=x.institution;$("#mfocus").textContent=x.focus;$("#mnote").textContent=x.note;$("#mimg").src=x.image;$("#mlink").href=x.source;$("#modal").classList.add("show")}
$("#close").onclick=()=>$("#modal").classList.remove("show");$("#modal").onclick=e=>{if(e.target.id==="modal")$("#modal").classList.remove("show")};
[q,era,type,inst].forEach(el=>el.addEventListener(el===q?"input":"change",render));document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#modal").classList.remove("show")});render();
</script></body></html>
