<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>美术绘制参考</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f4f1ea;--panel:#fffdf8;--ink:#24231f;--muted:#777268;--line:#ded8cc;--accent:#6f4c2f;--chip:#ece4d7;--sidebar:#ebe5d9;--danger:#a4483f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:20;flex-shrink:0;background:rgba(244,241,234,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.wrap{max-width:1600px;margin:auto;padding:16px 22px}.top{display:flex;gap:16px;align-items:end;justify-content:space-between;flex-wrap:wrap}
h1{font-size:27px;margin:0 0 4px}.sub{font-size:13px;color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar input,.toolbar select{height:38px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:0 11px}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:var(--danger)}
.layout{max-width:1600px;width:100%;margin:auto;flex:1;min-height:0;display:grid;grid-template-columns:240px 1fr;grid-template-rows:minmax(0,1fr);gap:18px;padding:20px 22px;overflow:hidden}.sidebar{background:var(--sidebar);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#categories{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
.side-title{font-size:12px;color:var(--muted);padding:4px 8px 10px}.cat{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:transparent;padding:10px;border-radius:9px;text-align:left}.cat:hover,.cat.active{background:#fff}.count{font-size:12px;color:var(--muted)}
.cat-row{display:flex;align-items:center}.cat-row .cat{flex:1;min-width:0;gap:8px}.cat-row .cat>span:first-child{overflow-wrap:anywhere}
.main{min-width:0;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;padding-bottom:40px}.notice{background:#eef7ee;border:1px solid #bdd8bd;padding:10px 12px;border-radius:10px;font-size:12px;line-height:1.6;margin-bottom:14px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-head h2{font-size:20px;margin:0}.stats,.status{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:.18s;box-shadow:0 2px 10px rgba(0,0,0,.025)}.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.thumb{height:210px;overflow:hidden;background:#ddd;position:relative}.thumb img,.thumb canvas{width:100%;height:100%;object-fit:cover;display:block}.badge{position:absolute;top:10px;left:10px;background:rgba(30,27,22,.78);color:#fff;padding:4px 8px;border-radius:999px;font-size:12px}
.meta{padding:13px}.meta h3{font-size:15px;line-height:1.4;margin:0 0 8px}.line{font-size:12px;color:var(--muted);line-height:1.55}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{font-size:11px;background:var(--chip);padding:4px 7px;border-radius:999px}
.card-actions{display:flex;gap:6px;margin-top:10px}.mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;font-size:12px}.empty{text-align:center;padding:80px;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.modal{position:fixed;inset:0;background:rgba(20,18,15,.78);z-index:100;display:none;align-items:center;justify-content:center;padding:24px}.modal.show{display:flex}.modalbox{width:min(700px,96vw);max-height:92vh;background:var(--panel);border-radius:16px;overflow:auto;padding:24px;position:relative}.close{position:absolute;right:14px;top:12px;border:0;background:#fff;border-radius:50%;width:36px;height:36px;font-size:22px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}.modalbox input,.modalbox select,.modalbox textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px}.modalbox textarea{min-height:90px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.preview{max-width:100%;max-height:420px;display:block;margin:auto}.syncdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#45a35a;margin-right:6px}
.detail-page{display:none}
.detail-page.show{display:block}
.detail-shell{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,.8fr);gap:24px}
.detail-image-wrap{background:#201f1c;border-radius:14px;min-height:520px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.detail-image-wrap img,.detail-image-wrap canvas{max-width:100%;max-height:76vh;object-fit:contain;display:block;cursor:zoom-in}
.detail-image-hint{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.58);color:#fff;padding:6px 9px;border-radius:8px;font-size:12px;pointer-events:none}
.detail-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:46px;height:58px;border:0;border-radius:12px;background:rgba(0,0,0,.55);color:#fff;font-size:34px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(6px)}
.detail-nav:hover{background:rgba(0,0,0,.72)}
.detail-nav:disabled{opacity:.22;cursor:default}
.detail-nav.prev{left:12px}.detail-nav.next{right:12px}
.detail-counter{position:absolute;right:12px;bottom:12px;z-index:4;background:rgba(0,0,0,.58);color:#fff;padding:6px 9px;border-radius:8px;font-size:12px;pointer-events:none}
.zoom-viewer{position:fixed;inset:0;z-index:300;background:rgba(10,10,10,.96);display:none}
.zoom-viewer.show{display:block}
.zoom-stage{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none}
.zoom-stage.dragging{cursor:grabbing}
.zoom-stage img,.zoom-stage canvas{position:absolute;left:0;top:0;max-width:none;max-height:none;transform-origin:0 0;user-select:none;-webkit-user-drag:none}
.zoom-toolbar{position:absolute;z-index:2;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:rgba(28,28,28,.78);padding:8px;border-radius:12px;backdrop-filter:blur(10px)}
.zoom-toolbar button{border:1px solid rgba(255,255,255,.22);background:#fff;color:#222;border-radius:8px;padding:8px 12px;cursor:pointer}
.zoom-toolbar .zoom-close{background:#333;color:#fff}
.zoom-percent{min-width:58px;text-align:center;color:#fff;font-size:13px}
.detail-panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;height:fit-content}
.detail-panel h2{margin:0 0 14px;font-size:24px;line-height:1.35}
.detail-kv{display:grid;grid-template-columns:88px 1fr;gap:8px 12px;font-size:14px;line-height:1.6;margin-top:14px}
.detail-kv .k{color:var(--muted)}
.detail-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.detail-actions{position:sticky;top:0;z-index:10;display:flex;align-items:center;background:var(--bg);padding:0 0 14px}
.detail-back{flex-shrink:0}
.image-paste-area{border:1px dashed var(--line);border-radius:10px;background:#f8f5ee;padding:14px;margin-top:10px;outline:none;font-size:13px;color:var(--muted)}
.image-paste-area:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--chip)}
.image-upload-preview{margin-top:10px}.image-upload-preview img{max-width:100%;max-height:240px;display:block;border-radius:8px;margin-bottom:8px}
.thumb,.meta h3{cursor:pointer}
@media(max-width:900px){.layout{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}.sidebar{height:min(24dvh,220px)}.thumb{height:180px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.detail-shell{grid-template-columns:1fr}.detail-image-wrap{min-height:320px}}
</style>
</head>
<body>
<header><div class="wrap"><div class="top">
<div><h1>美术绘制参考</h1><div class="sub"><span class="syncdot"></span>云端共享图库 · 多设备实时同步</div></div>
<div class="toolbar">
<input id="q" type="search" name="art_reference_query" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="搜索标题 / 标签 / 来源…">
<button class="btn secondary" id="clearFiltersBtn" type="button">清空筛选</button>
<select id="era"><option value="">全部年代</option></select>
<select id="type"><option value="">全部类型</option></select>
<select id="subCategoryFilter"><option value="">全部细分</option></select>
<select id="sourceSite"><option value="">全部来源</option></select>
<button class="btn secondary" id="authBtn">登录</button>
<a class="btn secondary editorOnly" href="./importer.html" style="display:none;text-decoration:none">高清母图入库</a>
<button class="btn secondary editorOnly" id="addCategoryBtn" style="display:none">＋ 新增大类</button>
<button class="btn editorOnly" id="addItemBtn" style="display:none">＋ 新增参考</button>
<button class="btn secondary editorOnly" id="renameCategoryBtn" style="display:none" type="button">分类改名</button>
</div></div><div class="status" id="userStatus"></div></div></header>

<div class="layout">
<aside class="sidebar"><div class="side-title">参考大类</div><div id="categories"></div></aside>
<main class="main">
<div class="notice">图库数据已改为云端共享：任意设备打开同一网址都会看到同一套分类与参考。登录后可新增、修改、删除；图片可直接上传。</div>
<div id="listView">
<div class="section-head"><h2 id="currentTitle">全部参考</h2><div class="stats" id="stats"></div></div>
<div class="grid" id="grid"></div>
</div>
<div class="detail-page" id="detailPage">
  <div class="detail-actions">
    <button class="btn secondary detail-back" id="detailBackBtn" type="button">← 返回图库</button>
    <button class="btn secondary" id="downloadNativeCrop" type="button" style="display:none;margin-left:9px">下载原生像素 PNG</button>
  </div>
  <div class="detail-shell">
    <div class="detail-image-wrap" id="detailImageWrap">
      <button class="detail-nav prev" id="detailPrevBtn" type="button" aria-label="上一张">‹</button>
      <img id="detailImage" alt=""><canvas id="detailCanvas" style="display:none"></canvas>
      <button class="detail-nav next" id="detailNextBtn" type="button" aria-label="下一张">›</button>
      <div class="detail-image-hint">高清局部 · 点击放大 · 滚轮缩放</div>
      <div class="detail-counter" id="detailCounter"></div>
    </div>
    <div class="detail-panel">
      <h2 id="detailTitle"></h2>
      <div class="detail-kv">
        <div class="k">原作</div><div id="detailWorkTitle"></div>
        <div class="k">大类</div><div id="detailCategory"></div>
        <div class="k">细分</div><div id="detailSubCategory"></div>
        <div class="k">年代</div><div id="detailEra"></div>
        <div class="k">类型</div><div id="detailType"></div>
        <div class="k">作者</div><div id="detailArtist"></div>
        <div class="k">来源机构</div><div id="detailInstitution"></div>
        <div class="k">来源网站</div><div id="detailSourceSite"></div>
        <div class="k">材质</div><div id="detailMaterial"></div>
        <div class="k">尺寸</div><div id="detailDimensions"></div>
        <div class="k">文物号</div><div id="detailObjectNo"></div>
        <div class="k">归属说明</div><div id="detailAttribution"></div>
        <div class="k">绘制重点</div><div id="detailFocus"></div>
        <div class="k">说明</div><div id="detailNote"></div>
      </div>
      <div class="detail-tags" id="detailTags"></div>
      <div class="card-actions" style="margin-top:18px">
        <a class="btn secondary" id="detailSource" target="_blank" rel="noopener">查看来源 ↗</a>
        <button class="btn secondary editorOnly" id="detailEditBtn" style="display:none">编辑</button>
        <button class="btn danger editorOnly" id="detailDeleteBtn" style="display:none">删除</button>
      </div>
    </div>
  </div>
</div>
</main></div>

<div class="zoom-viewer" id="zoomViewer" aria-hidden="true">
  <div class="zoom-stage" id="zoomStage">
    <img id="zoomImage" alt="" style="display:none">
    <canvas id="zoomCanvas" style="display:none"></canvas>
  </div>
  <div class="zoom-toolbar">
    <button id="zoomOutBtn" type="button">−</button>
    <span class="zoom-percent" id="zoomPercent">100%</span>
    <button id="zoomInBtn" type="button">＋</button>
    <button id="zoomResetBtn" type="button">还原</button>
    <button class="zoom-close" id="zoomCloseBtn" type="button">关闭 ×</button>
  </div>
</div>

<div class="modal" id="authModal"><div class="modalbox">
<button class="close" data-close="authModal">×</button><h2>协作账号</h2>
<div class="formgrid">
<div class="full"><label>邮箱</label><input id="authEmail" type="email" placeholder="name@example.com"></div>
<div class="full"><label>密码</label><input id="authPassword" type="password" placeholder="至少 6 位"></div>
</div>
<div class="actions"><button class="btn secondary" id="resendBtn">重新发送确认邮件</button><button class="btn secondary" id="signupBtn">创建账号</button><button class="btn" id="loginBtn">登录</button></div>
<div class="status" id="authMsg" style="margin-top:12px"></div>
</div></div>

<div class="modal" id="categoryModal"><div class="modalbox">
<button class="close" data-close="categoryModal">×</button><h2 id="categoryModalTitle">新增大类</h2>
<div id="renameCategorySelectWrap" style="display:none;margin-bottom:12px"><label for="renameCategorySelect">选择需要改名的大类</label><select id="renameCategorySelect"></select></div>
<label for="newCategoryName">大类名称</label><input id="newCategoryName" maxlength="60" placeholder="例如：兵器、箱柜、交通工具">
<div class="status" id="categoryMsg" role="status" style="margin-top:12px"></div>
<div class="actions"><button class="btn" id="saveCategory">保存</button></div>
</div></div>

<div class="modal" id="itemModal"><div class="modalbox">
<button class="close" data-close="itemModal">×</button><h2 id="itemModalTitle">新增参考</h2>
<div class="formgrid">
<div><label>标题 *</label><input id="fTitle"></div>
<div><label>大类 *</label><select id="fCategory"></select></div>
<div><label>细分</label><input id="fSubCategory" placeholder="例如：书柜 / 多宝格 / 琴桌 / 折屏"></div>
<div class="full"><label for="fFile">上传图片</label><input id="fFile" type="file" accept="image/*">
<div class="image-paste-area" id="imagePasteArea" tabindex="0" role="group" aria-label="粘贴图片区域">复制图片后，点击这里按 Ctrl+V 粘贴（Mac：⌘+V）。也可以在本窗口直接粘贴图片。</div>
<div class="status" id="imageUploadStatus" role="status" aria-live="polite"></div>
<div class="image-upload-preview" id="imageUploadPreview" hidden><img id="imageUploadPreviewImg" alt="待保存图片预览"><button class="mini" id="clearPendingImageBtn" type="button">取消更换图片</button></div>
</div>
<div class="full"><label>或填写图片地址</label><input id="fImage" placeholder="https://...jpg"></div>
<div class="full"><label>来源页</label><input id="fSource"></div>
<div><label>年代</label><input id="fEra" placeholder="北宋 / 明代 / 近现代"></div>
<div><label>类型</label><input id="fType" placeholder="古画 / 实物 / 连环画"></div>
<div class="full"><label>来源机构 / 作者</label><input id="fInstitution"></div>
<div class="full"><label>绘制重点</label><input id="fFocus"></div>
<div class="full"><label>标签</label><input id="fTags" placeholder="用逗号分隔"></div>
<div class="full"><label>说明</label><textarea id="fNote"></textarea></div>
</div>
<div class="status" id="saveMsg"></div>
<div class="actions"><button class="btn" id="saveItem">保存</button></div>
</div></div>


<script>
const SUPABASE_URL="https://otaokoencpoanxjjuqzv.supabase.co";
const SUPABASE_KEY="sb_publishable_hA9UHbP834axMbvdRRbwyA_4dUTU2-B";
const APP_URL="https://zhengjialai7-a11y.github.io/ancient-stove-reference/";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s);
let categories=[],refs=[],user=null,activeCategory="全部参考",editingId=null,currentDetailId=null;
let editingCategoryId=null,categorySaving=false;
let pendingImageFile=null,pendingImagePreviewUrl=null,itemSaving=false;

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function openModal(id){$("#"+id).classList.add("show")}function closeModal(id){if(id==="itemModal"&&itemSaving)return;$("#"+id).classList.remove("show");if(id==="itemModal")clearPendingImage()}
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>closeModal(b.dataset.close));
document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{if(e.target===m)closeModal(m.id)}));

async function loadAll(){
 const [{data:c,error:ce},{data:r,error:re}]=await Promise.all([
   db.from("categories").select("*").order("sort_order"),
   db.from("references").select("*,categories(id,name)").order("created_at",{ascending:false})
 ]);
 if(ce||re){console.error(ce||re);return}
 const activeId=categories.find(x=>x.name===activeCategory)?.id;
 categories=c||[];refs=(r||[]).map(x=>({...x,category:x.categories?.name||"其他"}));
 if(activeId)activeCategory=categories.find(x=>x.id===activeId)?.name||"全部参考";
 fillFilters();renderCategories();render();syncDetailFromHash();
}
function fillFilters(){
 const ev=$("#era").value,tv=$("#type").value,subv=$("#subCategoryFilter").value,sv=$("#sourceSite").value;
 $("#era").innerHTML='<option value="">全部年代</option>';$("#type").innerHTML='<option value="">全部类型</option>';$("#subCategoryFilter").innerHTML='<option value="">全部细分</option>';$("#sourceSite").innerHTML='<option value="">全部来源</option>';
 [...new Set(refs.map(x=>x.era).filter(Boolean))].sort().forEach(v=>$("#era").add(new Option(v,v)));
 [...new Set(refs.map(x=>x.type).filter(Boolean))].sort().forEach(v=>$("#type").add(new Option(v,v)));
 [...new Set(refs.map(x=>x.sub_category).filter(Boolean))].sort().forEach(v=>$("#subCategoryFilter").add(new Option(v,v)));
 [...new Set(refs.map(x=>x.source_site).filter(Boolean))].sort().forEach(v=>$("#sourceSite").add(new Option(v,v)));
 $("#era").value=ev;$("#type").value=tv;$("#subCategoryFilter").value=subv;$("#sourceSite").value=sv;
 const selectedCategory=$("#fCategory").value;
 $("#fCategory").innerHTML="";categories.forEach(c=>$("#fCategory").add(new Option(c.name,c.id)));
 if(categories.some(c=>c.id===selectedCategory))$("#fCategory").value=selectedCategory;
}
function renderCategories(){
 const box=$("#categories"),scrollTop=box.scrollTop;box.innerHTML="";
 ["全部参考",...categories.map(c=>c.name)].forEach(name=>{
   const n=name==="全部参考"?refs.length:refs.filter(x=>x.category===name).length;
   const b=document.createElement("button");b.className="cat"+(name===activeCategory?" active":"");
   b.innerHTML='<span>'+esc(name)+'</span><span class="count">'+n+'</span>';b.onclick=()=>{activeCategory=name;sanitizeSearch();closeDetailPage(true);renderCategories();render();$(".main").scrollTo({top:0})};
   const row=document.createElement("div");row.className="cat-row";row.appendChild(b);
   box.appendChild(row);
 });
 box.scrollTop=scrollTop;
}
function sanitizeSearch(){
 const el=$("#q"); if(!el) return;
 const v=(el.value||"").trim();
 if(v && (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) || (user?.email && v.toLowerCase()===user.email.toLowerCase()))) el.value="";
}
function clearFilters(){
 $("#q").value=""; $("#era").value=""; $("#type").value=""; $("#subCategoryFilter").value=""; $("#sourceSite").value=""; render();
}
function getBrowseRows(){
 sanitizeSearch();
 const term=$("#q").value.trim().toLowerCase(),ev=$("#era").value,tv=$("#type").value,subv=$("#subCategoryFilter").value,sv=$("#sourceSite").value;
 return refs.filter(x=>(activeCategory==="全部参考"||x.category===activeCategory)&&(!ev||x.era===ev)&&(!tv||x.type===tv)&&(!subv||x.sub_category===subv)&&(!sv||x.source_site===sv)&&(!term||JSON.stringify(x).toLowerCase().includes(term)));
}
function render(){
 sanitizeSearch();
 const term=$("#q").value.trim().toLowerCase(),ev=$("#era").value,tv=$("#type").value,subv=$("#subCategoryFilter").value,sv=$("#sourceSite").value;
 const rows=getBrowseRows();
 $("#currentTitle").textContent=activeCategory;$("#stats").textContent="显示 "+rows.length+" / "+refs.length+" 条参考";
 const hasFilter=!!(term||ev||tv||subv||sv);
 $("#grid").innerHTML=rows.length?"":(hasFilter?'<div class="empty">当前筛选没有结果。<br><button class="mini" id="emptyClearBtn" style="margin-top:12px">清空筛选</button></div>':'<div class="empty">这个分类还没有参考图。</div>');
 if(!rows.length&&hasFilter){const b=$("#emptyClearBtn");if(b)b.onclick=clearFilters;}
 rows.forEach(x=>{
  const card=document.createElement("article");card.className="card";

function hasCrop(x){
 return [x.crop_x,x.crop_y,x.crop_w,x.crop_h].every(v=>v!==null&&v!==undefined) && x.crop_w>0 && x.crop_h>0;
}
function drawCrop(canvas,x,detail=false,onDone=null){
 if(!canvas||!hasCrop(x)){if(onDone)onDone(false);return}
 const img=new Image();
 img.onload=()=>{
   const sx=x.crop_x*img.naturalWidth,sy=x.crop_y*img.naturalHeight,sw=x.crop_w*img.naturalWidth,sh=x.crop_h*img.naturalHeight;
   const ctx=canvas.getContext("2d");
   if(detail){
     // Keep the real source resolution whenever possible. Never enlarge a small source.
     const maxW=5000,maxH=3500;
     const ratio=Math.min(1,maxW/sw,maxH/sh);
     canvas.width=Math.max(1,Math.round(sw*ratio));
     canvas.height=Math.max(1,Math.round(sh*ratio));
     ctx.imageSmoothingEnabled=true;
     ctx.imageSmoothingQuality="high";
     ctx.clearRect(0,0,canvas.width,canvas.height);
     ctx.drawImage(img,sx,sy,sw,sh,0,0,canvas.width,canvas.height);
   }else{
     canvas.width=600;canvas.height=420;
     ctx.imageSmoothingEnabled=true;
     ctx.imageSmoothingQuality="high";
     ctx.clearRect(0,0,600,420);
     ctx.drawImage(img,sx,sy,sw,sh,0,0,600,420);
   }
   if(onDone)onDone(true);
 };
 img.onerror=()=>{
   const ctx=canvas.getContext("2d");canvas.width=600;canvas.height=420;
   ctx.fillStyle="#eee8dc";ctx.fillRect(0,0,600,420);ctx.fillStyle="#777268";ctx.font="24px sans-serif";ctx.fillText("参考图加载失败",210,215);
   if(onDone)onDone(false);
 };
 img.src=x.image_url;
}

const zoomState={scale:1,minScale:.1,maxScale:10,x:0,y:0,w:0,h:0,dragging:false,lastX:0,lastY:0,target:null};

function activeDetailVisual(){
  const canvas=$("#detailCanvas"),img=$("#detailImage");
  return canvas.style.display!=="none" ? {type:"canvas",el:canvas} : {type:"img",el:img};
}
function renderZoom(){
  if(!zoomState.target)return;
  zoomState.target.style.transform="translate("+zoomState.x+"px,"+zoomState.y+"px) scale("+zoomState.scale+")";
  $("#zoomPercent").textContent=Math.round(zoomState.scale*100)+"%";
}
function fitZoom(){
  const stage=$("#zoomStage");
  if(!zoomState.target||!zoomState.w||!zoomState.h)return;
  const pad=48,sw=stage.clientWidth-pad*2,sh=stage.clientHeight-pad*2;
  zoomState.scale=Math.min(sw/zoomState.w,sh/zoomState.h,1);
  zoomState.minScale=Math.max(.05,zoomState.scale*.35);
  zoomState.x=(stage.clientWidth-zoomState.w*zoomState.scale)/2;
  zoomState.y=(stage.clientHeight-zoomState.h*zoomState.scale)/2;
  renderZoom();
}
function openZoomViewer(){
  const v=activeDetailVisual();
  if(!v||!v.el)return;
  const viewer=$("#zoomViewer"),zi=$("#zoomImage"),zc=$("#zoomCanvas");
  zi.style.display="none";zc.style.display="none";
  if(v.type==="canvas"){
    const x=refs.find(r=>String(r.id)===String(currentDetailId));
    if(!x||!hasCrop(x))return;
    zc.style.display="block";
    viewer.classList.add("show");viewer.setAttribute("aria-hidden","false");
    drawCrop(zc,x,true,ok=>{
      if(!ok)return;
      zoomState.target=zc;zoomState.w=zc.width;zoomState.h=zc.height;
      requestAnimationFrame(fitZoom);
    });
  }else{
    const start=()=>{
      zoomState.target=zi;zoomState.w=zi.naturalWidth||v.el.naturalWidth;zoomState.h=zi.naturalHeight||v.el.naturalHeight;
      viewer.classList.add("show");viewer.setAttribute("aria-hidden","false");
      requestAnimationFrame(fitZoom);
    };
    zi.alt=v.el.alt||"";
    zi.onload=start;
    zi.src=v.el.currentSrc||v.el.src;
    zi.style.display="block";
    if(zi.complete&&zi.naturalWidth)start();
  }
  document.body.style.overflow="hidden";
}
function closeZoomViewer(){
  $("#zoomViewer").classList.remove("show");
  $("#zoomViewer").setAttribute("aria-hidden","true");
  document.body.style.overflow="";
  zoomState.target=null;
}
function zoomAt(factor,cx,cy){
  if(!zoomState.target)return;
  const stage=$("#zoomStage").getBoundingClientRect();
  const px=(cx??(stage.left+stage.width/2))-stage.left;
  const py=(cy??(stage.top+stage.height/2))-stage.top;
  const old=zoomState.scale;
  const next=Math.max(zoomState.minScale,Math.min(zoomState.maxScale,old*factor));
  if(next===old)return;
  zoomState.x=px-(px-zoomState.x)*(next/old);
  zoomState.y=py-(py-zoomState.y)*(next/old);
  zoomState.scale=next;renderZoom();
}
$("#detailImageWrap").addEventListener("click",e=>{
  if(e.target.id==="detailImage"||e.target.id==="detailCanvas") openZoomViewer();
});
$("#zoomStage").addEventListener("wheel",e=>{
  e.preventDefault();
  zoomAt(e.deltaY<0?1.16:1/1.16,e.clientX,e.clientY);
},{passive:false});
$("#zoomStage").addEventListener("mousedown",e=>{
  if(e.button!==0)return;
  zoomState.dragging=true;zoomState.lastX=e.clientX;zoomState.lastY=e.clientY;
  $("#zoomStage").classList.add("dragging");
});
window.addEventListener("mousemove",e=>{
  if(!zoomState.dragging)return;
  zoomState.x+=e.clientX-zoomState.lastX;zoomState.y+=e.clientY-zoomState.lastY;
  zoomState.lastX=e.clientX;zoomState.lastY=e.clientY;renderZoom();
});
window.addEventListener("mouseup",()=>{
  zoomState.dragging=false;$("#zoomStage").classList.remove("dragging");
});
$("#zoomStage").addEventListener("dblclick",e=>{e.preventDefault();fitZoom()});
$("#zoomInBtn").onclick=()=>zoomAt(1.25);
$("#zoomOutBtn").onclick=()=>zoomAt(1/1.25);
$("#zoomResetBtn").onclick=fitZoom;
$("#zoomCloseBtn").onclick=closeZoomViewer;
window.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("#zoomViewer").classList.contains("show")){closeZoomViewer();return}
  if($("#zoomViewer").classList.contains("show"))return;
  if(!$("#detailPage").classList.contains("show"))return;
  if(e.key==="ArrowLeft"){e.preventDefault();navigateDetail(-1)}
  if(e.key==="ArrowRight"){e.preventDefault();navigateDetail(1)}

window.addEventListener("resize",()=>{
  if($("#zoomViewer").classList.contains("show"))fitZoom();

async function downloadNativeCrop(x){
 if(!hasCrop(x))return;
 const btn=$("#downloadNativeCrop");btn.disabled=true;btn.textContent="正在生成原像素图片…";
 try{
   const img=new Image();img.crossOrigin="anonymous";
   await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error("母图跨域读取失败，无法导出；请从来源链接下载原图"));img.src=x.image_url;});
   const sx=Math.round(x.crop_x*img.naturalWidth),sy=Math.round(x.crop_y*img.naturalHeight);
   const sw=Math.round(x.crop_w*img.naturalWidth),sh=Math.round(x.crop_h*img.naturalHeight);
   if(sw<=0||sh<=0||sx<0||sy<0||sx+sw>img.naturalWidth||sy+sh>img.naturalHeight)throw new Error("原图裁切范围错误");
   if(sw*sh>80000000)throw new Error("裁切区域过大，请在工作台缩小范围再下载");
   const canvas=document.createElement("canvas");canvas.width=sw;canvas.height=sh;
   const ctx=canvas.getContext("2d",{alpha:false});ctx.imageSmoothingEnabled=false;
   ctx.drawImage(img,sx,sy,sw,sh,0,0,sw,sh);
   const blob=await new Promise(ok=>canvas.toBlob(ok,"image/png"));
   if(!blob)throw new Error("浏览器无法生成 PNG");
   const link=document.createElement("a"),url=URL.createObjectURL(blob);
   link.href=url;link.download=(x.title||"高清局部").replace(/[\\/:*?"<>|]/g,"_")+".png";link.click();
   setTimeout(()=>URL.revokeObjectURL(url),3000);
 }catch(e){alert("原像素下载失败："+e.message)}
 finally{btn.disabled=false;btn.textContent="下载原生像素 PNG"}
}

 const {error}=await db.storage.from("art-reference-images").upload(path,file,{upsert:false,contentType:file.type||undefined});

}

$("#saveCategory").onclick=saveCategory;$("#saveItem").onclick=saveItem;
["q","era","type","subCategoryFilter","sourceSite"].forEach(id=>$("#"+id).addEventListener(id==="q"?"input":"change",render));
$("#clearFiltersBtn").onclick=clearFilters;
$("#q").addEventListener("focus",sanitizeSearch);
setTimeout(()=>{sanitizeSearch();render()},300);
setTimeout(()=>{sanitizeSearch();render()},1200);

db.auth.onAuthStateChange(()=>refreshAuth());
db.channel("art-reference-live")
 .on("postgres_changes",{event:"*",schema:"public",table:"categories"},()=>loadAll())
 .on("postgres_changes",{event:"*",schema:"public",table:"references"},()=>loadAll())
 .subscribe();
setInterval(loadAll,30000);
(async()=>{await loadAll();await refreshAuth()})();
</script>
</body></html>
